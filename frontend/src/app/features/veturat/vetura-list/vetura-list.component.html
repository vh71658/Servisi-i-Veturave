<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
<div class="page-header flex flex-column md:flex-row md:align-items-center md:justify-content-between gap-3">
  <div><h1>Veturat</h1><p>Lista e veturave te regjistruara ne servis</p></div>
  <p-button label="Shto veture" icon="pi pi-plus" severity="secondary" routerLink="/veturat/shto"></p-button>
</div>
<div class="card">
  <p-table [value]="veturat" [loading]="loading" [paginator]="true" [rows]="5" styleClass="p-datatable-sm" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr><th>ID</th><th>Marka</th><th>Modeli</th><th>Targa</th><th class="text-right">Veprime</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-vetura>
      <tr>
        <td>{{ vetura.id }}</td><td>{{ vetura.marka }}</td><td>{{ vetura.modeli }}</td><td>{{ vetura.targa }}</td>
        <td class="text-right white-space-nowrap">
          <p-button icon="pi pi-eye" [rounded]="true" [text]="true" [routerLink]="['/veturat', vetura.id]"></p-button>
          <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="fshi(vetura)"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="5" class="text-center p-4">Nuk ka vetura.</td></tr></ng-template>
  </p-table>
</div>
